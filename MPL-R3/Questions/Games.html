<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Games Track | MPL</title>

    <link rel="stylesheet" href="track.css">
</head>

<body>

    <!-- ================= NAVBAR ================= -->
    <nav class="track-navbar">

        <div class="track-logo">
            <img src="../Logo.png" alt="MPL Logo">
        </div>

        <div class="track-navigation">

            <button class="track-nav-button" id="homeButton">
                HOME
            </button>

            <button class="track-nav-button" id="powerButton">
                POWERUP 
            </button>

            <button class="track-nav-button" id="resetButton">
                RESET 
            </button>

        </div>

    </nav>


    <!-- ================= TRACK HEADER ================= -->
    <header class="track-header">

        <h1 class="track-title">
            GAMES TRACK
        </h1>

        <div class="title-decoration"></div>

    </header>


    <!-- ================= QUESTIONS ================= -->
    <main class="question-grid">

        <!-- 100 -->
        <div class="question-card"
             data-track="GAMES"
             data-points="100"
             data-question="Which video game character is known for collecting rings?"
             data-answer="Sonic the Hedgehog">

            <h2 class="question-name">
                QUESTION 1
            </h2>

            <div class="question-divider"></div>

            <p class="question-points">
                100
            </p>

        </div>


        <!-- 200 -->
        <div class="question-card"
             data-track="GAMES"
             data-points="200"
             data-question="Which company created the Super Mario series?"
             data-answer="Nintendo">

            <h2 class="question-name">
                QUESTION 2
            </h2>

            <div class="question-divider"></div>

            <p class="question-points">
                200
            </p>

        </div>


        <!-- 300 -->
        <div class="question-card"
             data-track="GAMES"
             data-points="300"
             data-question="What is the name of the main character in the Minecraft game?"
             data-answer="Steve">

            <h2 class="question-name">
                QUESTION 3
            </h2>

            <div class="question-divider"></div>

            <p class="question-points">
                300
            </p>

        </div>


        <!-- 400 -->
        <div class="question-card"
             data-track="GAMES"
             data-points="400"
             data-question="Which game features the battle royale mode called 'Warzone'?"
             data-answer="Call of Duty">

            <h2 class="question-name">
                QUESTION 4
            </h2>

            <div class="question-divider"></div>

            <p class="question-points">
                400
            </p>

        </div>


        <!-- 500 -->
        <div class="question-card"
             data-track="GAMES"
             data-points="500"
             data-question="Which video game series features the characters Link and Princess Zelda?"
             data-answer="The Legend of Zelda">

            <h2 class="question-name">
                QUESTION 5
            </h2>

            <div class="question-divider"></div>

            <p class="question-points">
                500
            </p>

        </div>


        <!-- 600 -->
        <div class="question-card"
             data-track="GAMES"
             data-points="600"
             data-question="Which game is famous for the phrase 'Winner Winner Chicken Dinner'?"
             data-answer="PUBG / PlayerUnknown's Battlegrounds">

            <h2 class="question-name">
                QUESTION 6
            </h2>

            <div class="question-divider"></div>

            <p class="question-points">
                600
            </p>

        </div>

    </main>


    <!-- ================= QUESTION POPUP ================= -->
    <div class="question-popup" id="questionPopup">

        <div class="popup-content">

            <button class="close-popup" id="closePopup">
                ×
            </button>

            <p class="popup-track" id="popupTrack">
                GAMES
            </p>

            <h2 class="popup-question" id="popupQuestion">
                Question
            </h2>

            <p class="popup-points">
                <span id="popupPoints">100</span> POINTS
            </p>

            <button class="answer-button" id="answerButton">
                SHOW ANSWER
            </button>

            <div class="popup-answer" id="popupAnswer">
                Answer
            </div>

        </div>

    </div>


    <!-- ================= JAVASCRIPT ================= -->
    <script src="track.js"></script>

</body>
</html>
