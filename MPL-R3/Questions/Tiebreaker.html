<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Tiebreaker | MPL</title>

    <!-- COMMON CSS -->
    <link rel="stylesheet" href="track.css">
</head>


<body>

    <!-- =====================================================
         NAVBAR
    ====================================================== -->

    <header class="track-navbar">

        <!-- LOGO -->

        <div class="track-logo">

            <img
                src="../Logo.png"
                alt="MPL Logo"
            >

        </div>


        <!-- NAVIGATION -->

        <nav class="track-navigation">

            <button
                class="track-nav-button"
                id="homeButton"
            >
                Home
            </button>


            <button
                class="track-nav-button"
                id="powerButton"
            >
                PowerUp

                <!-- <span class="power-icon">
                    ⚡
                </span> -->
            </button>


            <button
                class="track-nav-button"
                id="resetButton"
            >
                Reset

                <!-- <span class="reset-icon">
                    ↻
                </span> -->
            </button>

        </nav>

    </header>



    <!-- =====================================================
         TRACK TITLE
    ====================================================== -->

    <section class="track-header">

        <h1 class="track-title">
            TIEBREAKER
        </h1>

        <div class="title-decoration">
            ◆ ◆ ◆
        </div>

    </section>



    <!-- =====================================================
         TIEBREAKER QUESTION
    ====================================================== -->

    <main class="question-grid">


        <!-- QUESTION 1 -->

        <div
            class="question-card"

            data-track="TIEBREAKER"

            data-question="Which country has won the most FIFA World Cup titles?"

            data-points="100"

            data-answer="Brazil has won the FIFA World Cup five times."
        >

            <div class="question-name">
                QUESTION 1
            </div>

            <div class="question-divider"></div>

            <div class="question-points">
                100
            </div>

        </div>



        <!-- QUESTION 2 -->

        <div
            class="question-card"

            data-track="TIEBREAKER"

            data-question="What is the capital city of Australia?"

            data-points="200"

            data-answer="Canberra."
        >

            <div class="question-name">
                QUESTION 2
            </div>

            <div class="question-divider"></div>

            <div class="question-points">
                200
            </div>

        </div>



        <!-- QUESTION 3 -->

        <div
            class="question-card"

            data-track="TIEBREAKER"

            data-question="Which planet is known as the Red Planet?"

            data-points="300"

            data-answer="Mars."
        >

            <div class="question-name">
                QUESTION 3
            </div>

            <div class="question-divider"></div>

            <div class="question-points">
                300
            </div>

        </div>



        <!-- QUESTION 4 -->

        <div
            class="question-card"

            data-track="TIEBREAKER"

            data-question="Who painted the Mona Lisa?"

            data-points="400"

            data-answer="Leonardo da Vinci."
        >

            <div class="question-name">
                QUESTION 4
            </div>

            <div class="question-divider"></div>

            <div class="question-points">
                400
            </div>

        </div>



        <!-- QUESTION 5 -->

        <div
            class="question-card"

            data-track="TIEBREAKER"

            data-question="What is the largest ocean on Earth?"

            data-points="500"

            data-answer="The Pacific Ocean."
        >

            <div class="question-name">
                QUESTION 5
            </div>

            <div class="question-divider"></div>

            <div class="question-points">
                500
            </div>

        </div>



        <!-- QUESTION 6 -->

        <div
            class="question-card"

            data-track="TIEBREAKER"

            data-question="Which is the only mammal capable of true sustained flight?"

            data-points="600"

            data-answer="The bat."
        >

            <div class="question-name">
                QUESTION 6
            </div>

            <div class="question-divider"></div>

            <div class="question-points">
                600
            </div>

        </div>

    </main>



    <!-- =====================================================
         QUESTION POPUP
    ====================================================== -->

    <div
        class="question-popup"
        id="questionPopup"
    >

        <div class="popup-content">


            <!-- CLOSE BUTTON -->

            <button
                class="close-popup"
                id="closePopup"
            >
                ×
            </button>


            <!-- TRACK NAME -->

            <div
                class="popup-track"
                id="popupTrack"
            >
                TIEBREAKER
            </div>


            <!-- QUESTION -->

            <div
                class="popup-question"
                id="popupQuestion"
            >
                Question
            </div>


            <!-- POINTS -->

            <div
                class="popup-points"
                id="popupPoints"
            >
                100
            </div>


            <!-- SHOW ANSWER -->

            <button
                class="answer-button"
                id="answerButton"
            >
                SHOW ANSWER
            </button>


            <!-- ANSWER -->

            <div
                class="popup-answer"
                id="popupAnswer"
            >
            </div>

        </div>

    </div>



    <!-- =====================================================
         COMMON JS
    ====================================================== -->

    <script src="track.js"></script>

</body>

</html>
