<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MPL Tracks</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Patrick+Hand&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================================
         DECORATIVE BACKGROUND
    ========================================== -->

    <div class="doodle doodle-left">〰</div>
    <div class="doodle doodle-right">✦</div>

    <div class="paper-plane">
        ➤
    </div>

    <div class="scribble scribble-1">✦</div>
    <div class="scribble scribble-2">〰</div>


    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="topbar">

        <!-- MPL LOGO -->
        <a href="index.html" class="logo">

            <img src="Logo.png" height="100px">

        </a>


        <!--  Control Buttons   -->
        <div class="controls">
            <!-- HOME BUTTON -->
            <a href="#" class="nav-button home">
                Home
            </a>
            
            
            <!-- POWER UP -->
            <a href="#" class="nav-button powerup">
                PowerUp
            </a>
            
            
            <!-- RESET -->
            <a href="#" class="nav-button reset">
                Reset
            </a>
        </div>
            
    </header>



    <!-- =========================================
         MAIN CONTENT
    ========================================== -->

    <main>

        <!-- TITLE -->

        <section class="hero">

            <h1>
                <span>MPL</span>
                <span class="tracks">TRACKS</span>
            </h1>

            <div class="underline"></div>

        </section>


        <!-- =====================================
             TRACK CARDS
        ====================================== -->

        <section class="tracks-grid">


            <!-- SPORTS -->

            <a href="Questions/Sports.html"
               class="track-card sports">

                <div class="track-icon trophy">
                    🏆
                </div>

                <h2>
                    SPORTS
                </h2>

                <div class="speed-lines">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

            </a>



            <!-- MOVIES -->

            <a href="Questions/Movies.html"
               class="track-card movies">

                <div class="track-icon">
                    🎬
                </div>

                <h2>
                    MOVIES
                </h2>

                <div class="speed-lines">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

            </a>



            <!-- MEMES -->

            <a href="Questions/Memes.html"
               class="track-card memes">

                <div class="track-icon">
                    😄
                </div>

                <h2>
                    MEMES
                </h2>

                <div class="speed-lines">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

            </a>



            <!-- TIEBREAKER -->

            <a href="Questions/Tiebreaker.html"
               class="track-card tiebreaker">

                <div class="track-icon">
                    🏆
                </div>

                <h2>
                    TIEBREAKER
                </h2>

                <div class="speed-lines">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

            </a>



            <!-- MATHS -->

            <a href="Questions/Maths.html"
               class="track-card maths">

                <div class="track-icon math-symbol">
                    π
                </div>

                <h2>
                    MATHS
                </h2>

                <div class="speed-lines">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

            </a>



            <!-- SONGS -->

            <a href="Questions/Songs.html"
               class="track-card songs">

                <div class="track-icon music-symbol">
                    ♪
                </div>

                <h2>
                    SONGS
                </h2>

                <div class="speed-lines">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

            </a>



            <!-- GAMES -->

            <a href="Questions/Games.html"
               class="track-card games">

                <div class="track-icon">
                    🎮
                </div>

                <h2>
                    GAMES
                </h2>

                <div class="speed-lines">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

            </a>



            <!-- RAPID FIRE -->

            <a href="Questions/RapidFire.html"
               class="track-card rapid">

                <div class="track-icon lightning">
                    ⚡
                </div>

                <h2>
                    RAPID FIRE
                </h2>

                <div class="speed-lines">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

            </a>

        </section>

    </main>

</body>
</html>
